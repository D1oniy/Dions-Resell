<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Dion's Laden - Elektronik</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="product-page">
  <div id="loginButton">
    <button onclick="goToLogin()">Login</button>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="bekleidung.html">Bekleidung</a>
    <a href="zubehoer.html">Zubehör</a>
    <a href="elektronik.html" class="active">Elektronik</a>
    <a href="sport.html">Sport & Freizeit</a>
    <a href="haushalt.html">Haushalt</a>
    <a href="anderes.html">Anderes</a>
  </nav>

  <h1>Elektronik</h1>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Suchen nach Name/Beschreibung...">
  </div>

  <div class="products-section" id="productsSection"></div>

  <div id="cart">
    <h2>Warenkorb</h2>
    <ul id="cartItems"></ul>
    <h3>Total: CHF<span id="totalValue">0</span></h3>
    <button onclick="window.location.href='checkout.html?cat=elektronik'">Zur Kasse gehen</button>
  </div>

  <button id="toggleProductBtn">Neues Produkt hinzufügen</button>
  <form id="newProductForm">
    <h3>Neues Produkt</h3>
    <label>Bild hochladen:</label>
    <input type="file" id="imageFile" accept="image/*" required>
    <label>Produktname:</label>
    <input type="text" id="productName" placeholder="Name..." required>
    <label>Beschreibung:</label>
    <textarea id="productDesc" rows="2" placeholder="Kurze Beschreibung..."></textarea>
    <label>Preis (CHF):</label>
    <input type="number" step="0.01" id="productPrice" placeholder="0.00" required>
    <label>Menge:</label>
    <input type="number" id="productQuantity" placeholder="1" required>
    <button type="submit">Hinzufügen</button>
  </form>

  <script src="main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      initProductPage("elektronik");
    });
  </script>
  <body>
    <div id="product-list"></div>
  
    <script src="main.js"></script>
  </body>
  
</body>
</html>
<div id="topButtons">
  <button onclick="goBack()">Zurück</button>
  <button onclick="goToLogin()">Login</button>
</div>
